<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopilka Мастер</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #0b0f19;
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 24px;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .card h2 {
            margin: 0 0 12px;
            color: #facc15;
        }
        .input-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        input, select, button, textarea {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 10px 14px;
            color: #f1f5f9;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #38bdf8;
        }
        button {
            background: #2563eb;
            border: none;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        button:hover { background: #1d4ed8; }
        button.danger { background: #b91c1c; }
        button.success { background: #15803d; }
        button.warning { background: #c2410c; }
        .file-list {
            background: #0f172a;
            border-radius: 10px;
            padding: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 14px;
        }
        .file-item {
            padding: 5px 0;
            border-bottom: 1px solid #1e293b;
            cursor: pointer;
        }
        .file-item:hover { color: #facc15; }
        .log {
            background: #000;
            padding: 10px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 13px;
            max-height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .run {
            background: #1e293b;
            padding: 10px;
            border-radius: 10px;
            margin: 6px 0;
        }
        .badge {
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .green { background: #166534; color: #bbf7d0; }
        .red { background: #991b1b; color: #fecaca; }
        .yellow { background: #854d0e; color: #fef08a; }
        hr { border-color: #334155; margin: 16px 0; }
        .small-text { font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>
<div class="container">
    <h1>🏦 Kopilka Мастер</h1>

    <!-- Токен -->
    <div class="card">
        <h2>🔑 Токен GitHub</h2>
        <div class="input-group">
            <input type="password" id="tokenInput" placeholder="ghp_...">
            <button onclick="saveToken()">💾 Сохранить</button>
            <button onclick="forgetToken()" class="danger">🗑 Забыть</button>
        </div>
        <p class="small-text">Нужен токен с правами <b>repo</b> и <b>workflow</b>. Хранится только в твоём браузере.</p>
    </div>

    <!-- Обзор файлов -->
    <div class="card">
        <h2>📁 Файлы проекта</h2>
        <button onclick="loadFiles()">🔄 Обновить список</button>
        <div class="file-list" id="fileList">Нажми "Обновить список"</div>
    </div>

    <!-- Загрузка файлов -->
    <div class="card">
        <h2>📤 Загрузить новые файлы</h2>
        <div class="input-group">
            <input type="text" id="targetFolder" placeholder="project/" value="project/">
            <input type="file" id="fileInput" multiple>
        </div>
        <button onclick="uploadFiles()" class="success">⬆️ Загрузить</button>
        <div class="log" id="uploadLog"></div>
    </div>

    <!-- Запуск сборки -->
    <div class="card">
        <h2>⚙️ Запустить сборку</h2>
        <div class="input-group">
            <select id="buildPlatform">
                <option value="android">🤖 Android APK</option>
                <option value="ios">🍏 iOS IPA</option>
                <option value="docker">🐳 Docker образ</option>
                <option value="electron">💻 Desktop (Electron)</option>
                <option value="all">🔥 Все платформы</option>
            </select>
            <button onclick="startBuild()" class="warning">🚀 Запустить</button>
        </div>
        <div class="log" id="buildLog"></div>
    </div>

    <!-- Статус сборок и артефакты -->
    <div class="card">
        <h2>📊 Последние сборки</h2>
        <button onclick="loadRuns()">🔄 Обновить</button>
        <div id="runsContainer"></div>
    </div>
</div>

<script>
    const OWNER = 'Dmitriy19730830';
    const REPO = 'InvestKopilka';
    const WORKFLOW_ID = 'build.yml';

    // Хранение токена
    function getToken() {
        return localStorage.getItem('github_token') || '';
    }
    function saveToken() {
        const t = document.getElementById('tokenInput').value.trim();
        if (!t) return alert('Введи токен');
        localStorage.setItem('github_token', t);
        document.getElementById('tokenInput').value = '';
        alert('Токен сохранён!');
    }
    function forgetToken() {
        localStorage.removeItem('github_token');
        alert('Токен удалён.');
    }
    // Автозаполнение поля при загрузке страницы
    window.onload = () => {
        const saved = getToken();
        if (saved) document.getElementById('tokenInput').placeholder = 'Токен сохранён (введи новый, чтобы заменить)';
    };

    async function githubApi(url, options = {}) {
        const token = getToken();
        if (!token) throw new Error('Сохрани токен в первом блоке');
        const headers = { Authorization: `token ${token}`, ...options.headers };
        const res = await fetch(url, { ...options, headers });
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.message || `HTTP ${res.status}`);
        }
        return res;
    }

    // Файлы репозитория
    async function loadFiles(path = '') {
        const fileList = document.getElementById('fileList');
        fileList.innerHTML = 'Загрузка...';
        try {
            const res = await githubApi(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`);
            const items = await res.json();
            fileList.innerHTML = '';
            if (!Array.isArray(items)) {
                // Одиночный файл – покажем содержимое
                if (items.type === 'file' && items.encoding === 'base64') {
                    const content = atob(items.content);
                    fileList.innerHTML = `<pre>${escapeHtml(content)}</pre>`;
                } else {
                    fileList.textContent = 'Нельзя отобразить';
                }
                return;
            }
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.textContent = (item.type === 'dir' ? '📁 ' : '📄 ') + item.path;
                div.onclick = () => {
                    if (item.type === 'dir') loadFiles(item.path);
                    else if (item.type === 'file') loadFiles(item.path);
                };
                fileList.appendChild(div);
            });
        } catch(e) {
            fileList.textContent = 'Ошибка: ' + e.message;
        }
    }

    function escapeHtml(text) {
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Загрузка файлов
    async function uploadFiles() {
        const log = document.getElementById('uploadLog');
        const folder = document.getElementById('targetFolder').value.replace(/^\/+|\/+$/g, '') || 'project';
        const files = document.getElementById('fileInput').files;
        if (!files.length) { alert('Выбери файлы'); return; }
        log.textContent = 'Загружаем...\n';
        const token = getToken();
        if (!token) { alert('Сохрани токен'); return; }

        for (const file of files) {
            const path = folder + '/' + file.name;
            try {
                const reader = new FileReader();
                const base64 = await new Promise((resolve, reject) => {
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });

                const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;
                let sha = null;
                const getResp = await githubApi(url).catch(() => null);
                if (getResp && getResp.ok) {
                    const data = await getResp.json();
                    sha = data.sha;
                }

                const body = JSON.stringify({
                    message: `Добавлен ${file.name} через Kopilka Мастер`,
                    content: base64,
                    sha: sha || undefined
                });
                await githubApi(url, { method: 'PUT', body });
                log.textContent += `✅ ${path}\n`;
            } catch(e) {
                log.textContent += `❌ ${path}: ${e.message}\n`;
            }
        }
        log.textContent += 'Готово.';
        document.getElementById('fileInput').value = '';
    }

    // Сборка
    async function startBuild() {
        const log = document.getElementById('buildLog');
        const platform = document.getElementById('buildPlatform').value;
        if (!getToken()) { alert('Сначала сохрани токен'); return; }
        log.textContent = `Запуск сборки (${platform})...\n`;
        try {
            await githubApi(
                `https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`,
                {
                    method: 'POST',
                    body: JSON.stringify({ ref: 'main', inputs: { platform } })
                }
            );
            log.textContent += '✅ Запущено! Смотри статус ниже.\n';
            loadRuns(); // обновим список
        } catch(e) {
            log.textContent += '❌ ' + e.message + '\n';
        }
    }

    // Список запусков
    async function loadRuns() {
        const container = document.getElementById('runsContainer');
        container.innerHTML = 'Загрузка...';
        try {
            const res = await githubApi(`https://api.github.com/repos/${OWNER}/${REPO}/actions/runs?per_page=5`);
            const data = await res.json();
            const runs = data.workflow_runs;
            container.innerHTML = '';
            if (!runs.length) {
                container.textContent = 'Нет запусков.';
                return;
            }
            runs.forEach(run => {
                const div = document.createElement('div');
                div.className = 'run';
                let statusBadge = '';
                if (run.status === 'completed' && run.conclusion === 'success') statusBadge = '<span class="badge green">✅ Успех</span>';
                else if (run.status === 'completed') statusBadge = '<span class="badge red">❌ Провал</span>';
                else statusBadge = '<span class="badge yellow">⏳ Выполняется</span>';

                div.innerHTML = `
                    <b>${run.display_title || run.name}</b> ${statusBadge}<br>
                    <span class="small-text">Запущен: ${new Date(run.created_at).toLocaleString()}</span>
                    <button onclick="downloadArtifacts(${run.id})" style="margin-top:6px; font-size:13px;">📥 Скачать артефакты</button>
                `;
                container.appendChild(div);
            });
        } catch(e) {
            container.textContent = 'Ошибка: ' + e.message;
        }
    }

    async function downloadArtifacts(runId) {
        try {
            const res = await githubApi(`https://api.github.com/repos/${OWNER}/${REPO}/actions/runs/${runId}/artifacts`);
            const data = await res.json();
            const artifacts = data.artifacts;
            if (!artifacts.length) {
                alert('Нет артефактов для этого запуска');
                return;
            }
            artifacts.forEach(art => {
                // Открываем ссылку на скачивание (требуется авторизация, поэтому используем fetch + blob)
                // Для простоты покажем ссылку (браузер скачает, если перейти)
                const url = art.archive_download_url;
                window.open(url, '_blank');
            });
        } catch(e) {
            alert('Ошибка получения артефактов: ' + e.message);
        }
    }

    // Автозагрузка при открытии
    loadRuns();
    loadFiles();
</script>
</body>
</html>
